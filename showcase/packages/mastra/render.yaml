services:
  - type: web
    name: showcase-mastra
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BASE_URL
        value: https://showcase.copilotkit.dev
      - fromGroup: showcase-shared-secrets
