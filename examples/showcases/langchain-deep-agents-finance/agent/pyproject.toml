[project]
name = "finsight-agent"
version = "0.1.0"
description = "FinSight - AI-Powered Portfolio Risk Analyst with Deep Agents"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph>=0.0.23",
    "copilotkit>=0.1.76",
    "deepagents>=0.3.5",
    "fastapi>=0.115.14",
    "langchain>=1.2.4",
    "langchain-openai>=1.1.7",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "agentevals>=0.1.0",
    "langsmith>=0.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
py-modules = ["agent", "main"]
packages = ["tools", "subagents", "prompts", "evals"]
