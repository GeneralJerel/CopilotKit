name: "Showcase: Build & Deploy"

on:
  push:
    branches: [feature/unified-showcase-platform, main]
    paths:
      - "showcase/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (shell, langgraph-python, all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - shell
          - langgraph-python

concurrency:
  group: showcase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      langgraph: ${{ steps.changes.outputs.langgraph }}
      shared: ${{ steps.changes.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shell:
              - 'showcase/shell/**'
              - 'showcase/shared/**'
              - 'showcase/scripts/**'
            langgraph:
              - 'showcase/packages/langgraph-python/**'
            shared:
              - 'showcase/shared/**'

  deploy-shell:
    name: Deploy Shell
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.shell == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      github.event.inputs.service == 'shell' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_SHELL }}" || echo "Deploy hook not configured yet"

  build-langgraph:
    name: Build & Push LangGraph Python
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.langgraph == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      github.event.inputs.service == 'langgraph-python' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: showcase/packages/langgraph-python
          push: true
          tags: |
            ghcr.io/copilotkit/showcase-langgraph-python:latest
            ghcr.io/copilotkit/showcase-langgraph-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        run: |
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_LANGGRAPH }}" || echo "Deploy hook not configured yet"
